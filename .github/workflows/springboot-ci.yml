name: Build Spring Boot JAR

on:
  push:
    branches: [ Main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR
        run: mvn clean package

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar

      # Collect commit author info
      - name: Get Commit Info
        id: commit_info
        run: |
          echo "AUTHOR_NAME=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      # Send email only if build fails
      - name: Send Failure Email
        if: failure()   # runs only when any step fails
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "❌ FAILURE: GitHub Build - ${{ github.repository }}"
          to: ${{ env.AUTHOR_EMAIL }}
          from: "GitHub Actions <${{ secrets.SMTP_USER }}>"
          content_type: text/html
          body: |
            <h3 style="color:red;">Build Failed ❌</h3>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Commit:</b> ${{ env.COMMIT_MSG }}</p>
            <p><b>Author:</b> ${{ env.AUTHOR_NAME }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">🔍 View Logs</a></p>
