name: Build Spring Boot JAR

on:
  push:
    branches: [ Main ]

jobs:
  build:
    runs-on: ubuntu-latest  # Uses Linux runner, which is fine even if you develop on Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven (clean, compile, package)
        run: mvn clean compile package

      - name: List generated JAR
        run: ls -l target/*.jar